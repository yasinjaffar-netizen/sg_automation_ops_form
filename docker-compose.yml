# ─────────────────────────────────────────────────────────────
# EPOS Referral System — Docker Compose (ECS / Alibaba Cloud)
# ─────────────────────────────────────────────────────────────
# Services:
#   frontend  — React (Nginx) on port 80, proxies /api/ to backend
#   backend   — FastAPI (uvicorn) on internal port 8000 only
#
# Both join epos-net; backend is NOT exposed to the public internet.
# Frontend only starts after backend passes its /health check.
# ─────────────────────────────────────────────────────────────
version: "3.9"

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: epos-backend
    restart: unless-stopped
    env_file: .env
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - epos-net

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: epos-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - epos-net

networks:
  epos-net:
    driver: bridge
